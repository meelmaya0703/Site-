<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loveflix VIP</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#000;
  color:white;
}

/* TOPO */
.hero{
  background: linear-gradient(180deg,#ff2e88,#000);
  text-align:center;
  padding:50px 20px;
}

.hero h1{
  font-size:28px;
}

.btn{
  background:#ff2e88;
  padding:15px 20px;
  border-radius:10px;
  display:inline-block;
  margin-top:20px;
  font-weight:bold;
}

/* SEÇÕES */
.section{
  padding:20px;
}

.section h2{
  margin-bottom:10px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns: repeat(2,1fr);
  gap:10px;
}

.card img{
  width:100%;
  border-radius:10px;
}

/* BANNER */
.banner img{
  width:100%;
  border-radius:15px;
  margin:15px 0;
}

/* PREÇO */
.price{
  text-align:center;
  font-size:32px;
  color:#00ff99;
  margin:20px 0;
}
</style>

</head>

<body>

<!-- TOPO -->
<div class="hero">
  <h1>MINISSÉRIES VICIANTES ❤️</h1>
  <p>Romance, CEO, vingança e muito mais!</p>
  <div class="btn">QUERO ACESSO AGORA</div>
</div>

<!-- BANNER PRINCIPAL -->
<div class="section banner">
  <img src="https://raw.githubusercontent.com/meelmaya0703/Site-/main/FF2F812B-236B-44DB-9FA5-B83E275B4BB7.png">
</div>

<!-- DORAMAS -->
<div class="section">
  <h2>🔥 Doramas em alta</h2>

  <div class="grid">
    <div class="card"><img src="https://raw.githubusercontent.com/meelmaya0703/Site-/main/05487B0E-8EC1-4567-808A-306A93E1310E.png"></div>
    <div class="card"><img src="https://raw.githubusercontent.com/meelmaya0703/Site-/main/08320234-AB1C-4A55-9047-83F107D49304.png"></div>
    <div class="card"><img src="https://raw.githubusercontent.com/meelmaya0703/Site-/main/1589126B-9781-487E-8F1A-345195B72EEE.png"></div>
    <div class="card"><img src="https://raw.githubusercontent.com/meelmaya0703/Site-/main/18A401E4-79D4-4FC8-82F0-96FD6C98934D.png"></div>
  </div>
</div>

<!-- MAIS ASSISTIDOS -->
<div class="section">
  <h2>⭐ Mais assistidos</h2>

  <div class="grid">
    <div class="card"><img src="https://raw.githubusercontent.com/meelmaya0703/Site-/main/458BB07E-38FA-4410-913C-D0D6B8B5B828.png"></div>
    <div class="card"><img src="https://raw.githubusercontent.com/meelmaya0703/Site-/main/62AAD302-7DDB-45C5-9675-07940B801FBE.png"></div>
    <div class="card"><img src="https://raw.githubusercontent.com/meelmaya0703/Site-/main/7CA5CBFD-BBCC-4A7C-AB40-DB0A65CD8115.png"></div>
    <div class="card"><img src="https://raw.githubusercontent.com/meelmaya0703/Site-/main/B505C4F3-B53B-46C7-8E57-80D2F83599F3.png"></div>
  </div>
</div>

<!-- BANNER -->
<div class="section banner">
  <img src="https://raw.githubusercontent.com/meelmaya0703/Site-/main/D8C0EBCF-6796-4666-897B-1F106DCB815B.png">
</div>

<!-- DEPOIMENTOS -->
<div class="section banner">
  <img src="https://raw.githubusercontent.com/meelmaya0703/Site-/main/E091C874-76A1-4B2A-9ECF-DFCED6C3F2A1.png">
</div>

<!-- OFERTA -->
<div class="section banner">
  <img src="https://raw.githubusercontent.com/meelmaya0703/Site-/main/EFF96B2E-1711-4EC7-9911-DD496B601130.png">
</div>

<!-- PREÇO -->
<div class="price">
  Apenas R$ 19,90
</div>

<div class="section" style="text-align:center;">
  <div class="btn">COMPRAR AGORA</div>
</div>

</body>
</html>
